# Standalone pnpm project (not a monorepo). Settings live here since pnpm 10.
packages:
  - .
overrides:
  # LHCI and Puppeteer reach basic-ftp through proxy-agent -> pac-proxy-agent -> get-uri, which still asks for ^5.3.1.
  # Every 5.x release has open advisories (GHSA-5pm8-86m8-9m6r and others); 6.2.3+ is patched.
  'get-uri>basic-ftp': 6.2.6
  # LHCI 0.16.1 still asks for chrome-launcher ^0.13.4 and only calls its static Launcher.getInstallations(). 0.13.4
  # pulls in rimraf 3 -> glob 7 -> minimatch 3, and glob 7 breaks on minimatch 11. 0.15.2 is the last CommonJS release
  # and has none of them.
  'chrome-launcher@0.13.4': 0.15.2
  # GHSA-g3hv-75wg-m249 (globparts amplification): only 11.0.1+ is patched, and eslint 10 and typescript-eslint still
  # ask for 10.x. 11 exports the same named API.
  'minimatch@<11.0.1': 11.0.3

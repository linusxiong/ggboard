name: CI

# Backend checks. The frontend has its own workflow, web.yml, so the two never wait for each other.

on:
  push:
    branches: [main]
  pull_request:
    # A pull request that only touches web/ cannot change anything this job checks (web.yml covers it). Pushes to main
    # always run it. See the note in web.yml before making this job a required check.
    paths-ignore:
      - web/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.27 patch release, not the go.mod minimum (1.27.1 has stdlib CVEs fixed in 1.27.2/1.27.3:
          # net/http, http2, crypto/x509, html/template; see docs/REVIEW_2026-10-22.md).
          go-version: "1.27.x"
          check-latest: true
          cache: true
      - name: gofmt
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test
        run: go test ./... -race -count=1

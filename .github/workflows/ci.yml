name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27 patch release, not the go.mod minimum (1.27.1 has stdlib CVEs fixed in 1.27.2/1.27.3:
          # net/http, http2, crypto/x509, html/template; see docs/REVIEW_2026-10-22.md).
          go-version: "1.27.x"
          check-latest: true
          cache: true
      - name: gofmt
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test
        run: go test ./... -race -count=1

  web:
    name: Web (install, lint, build)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - name: Detect frontend
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 12
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C web install --frozen-lockfile
      - name: Vulnerability scan (including development tools)
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C web audit
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C web lint
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: pnpm -C web build

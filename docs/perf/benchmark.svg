<title id="title">GG Bond 性能 · requests per second (higher is better)</title>
<desc id="desc">Apple M5 Pro · 18 cores (6 Super + 12 Performance) · 48 GB RAM · macOS 27.0.1. v2ray (base64) 13,172 req/s (p99 18 ms); mihomo + standard rules 13,220 req/s (p99 18 ms); user list, If-None-Match → 304 85,902 req/s (p99 2.5 ms); user list, full body (10,000 users) 2,153 req/s (p99 127 ms); traffic push (1,000 users per report) 3,764 req/s (p99 27 ms); password login (argon2id) 115 req/s (p99 174 ms); index.html (prerendered, brotli) 83,951 req/s (p99 2.6 ms); largest JS chunk (brotli, immutable) 50,375 req/s (p99 3.5 ms).</desc>

<text x="28" y="628" class="t2" font-size="12">Server and load generator on the same machine over loopback: no TLS, no reverse proxy, one ggboard process.</text>
<text x="28" y="646" class="t2" font-size="12">Closed loop (each connection waits for its answer), so p99 is the latency at saturation. Login is argon2id-bound by design.</text>
<text x="28" y="664" class="t2" font-size="12">Data: docs/perf/results.json · method and caveats: docs/perf/README.md</text>

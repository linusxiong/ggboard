<title id="title">GG Bond 性能 · requests per second (higher is better)</title>
<desc id="desc">Apple M5 Pro · 18 cores (6 Super + 12 Performance) · 48 GB RAM · macOS 27.0.1. v2ray (base64) 13,208 req/s (p99 19 ms); mihomo + standard rules 13,322 req/s (p99 18 ms); user list, If-None-Match → 304 86,836 req/s (p99 2.5 ms); user list, full body (10,000 users) 29,794 req/s (p99 6.1 ms); traffic push (1,000 users per report) 4,282 req/s (p99 24 ms); password login (argon2id) 104 req/s (p99 164 ms); index.html (prerendered, brotli) 85,867 req/s (p99 2.5 ms); largest JS chunk (brotli, immutable) 51,842 req/s (p99 3.5 ms).</desc>

# GG Bond from the prebuilt image: no clone, no compiler. Needs Docker Compose >= 2.24.
# Put this file and a `.env` next to each other, then run from that directory:
#   curl -fsSLO https://raw.githubusercontent.com/linusxiong/ggboard/main/deploy/docker-compose.prebuilt.yml
#   curl -fsSL https://raw.githubusercontent.com/linusxiong/ggboard/main/.env.example -o .env
#   echo 'GGBOARD_VERSION=1.0.0' >> .env     # a release (1.0.0, 1.0, 1 or latest); `main` is the rolling build of main
#   docker compose -f docker-compose.prebuilt.yml up -d
#   docker compose -f docker-compose.prebuilt.yml exec ggboard ggboard admin create --email admin@example.com
# Upgrade: change GGBOARD_VERSION, then `docker compose -f docker-compose.prebuilt.yml pull && ... up -d`. Guide: docs/DEPLOY.md.
#
# `.env` sits beside this file and does two jobs: Compose reads it for the ${...} below, and `env_file:` hands it to the
# container as GGBOARD_* settings.
# The project name is fixed, so the data lives in the volume `ggboard_ggboard-data`. To keep using the volume of
# deploy/docker-compose.yml (`deploy_ggboard-data`), run every command with `-p deploy`.
name: ggboard

services:
  ggboard:
    # GGBOARD_IMAGE is for forks and mirrors. GGBOARD_VERSION is an image tag: the "Release" workflow publishes every v* tag
    # (v1.0.0 as 1.0.0, 1.0, 1 and latest; pre-releases never move latest), a manual run of the "Docker" workflow on main
    # publishes main, and every build is also sha-<short>.
    image: ${GGBOARD_IMAGE:-ghcr.io/linusxiong/ggboard}:${GGBOARD_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Only the data dir is pinned here; database driver/DSN, JWT secret, etc. come from .env
    # (values in `environment:` would override env_file, so keep them out of this block).
    environment:
      GGBOARD_DATA_DIR: /data
    ports:
      # Published on localhost only; put nginx (deploy/nginx.example.conf) in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - ggboard-data:/data
    stop_grace_period: 20s
    # The process is non-root and listens on 8080: it needs no capabilities and must never gain any.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional PostgreSQL for operators without a database server (docs/DEPLOY.md §5). Not started unless the profile
  # is enabled (`--profile postgres`, or COMPOSE_PROFILES=postgres in .env); the default install stays on SQLite.
  # Set GGBOARD_POSTGRES_PASSWORD in .env (the image refuses to initialize without one), copy the data with
  # `ggboard db copy`, then point the panel at it:
  #   GGBOARD_DATABASE_DRIVER=postgres
  #   GGBOARD_DATABASE_DSN=postgres://ggboard:<the same password>@postgres:5432/ggboard?sslmode=disable
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggboard
      POSTGRES_DB: ggboard
      POSTGRES_PASSWORD: ${GGBOARD_POSTGRES_PASSWORD:-}
    # Not published: only the ggboard service (same project network) connects to it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 60s

volumes:
  ggboard-data:
  postgres-data:

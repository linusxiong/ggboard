# Usage (from the repository root):
#   cp .env.example .env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec ggboard ggboard admin create --email admin@example.com
services:
  ggboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${GGBOARD_VERSION:-dev}
    image: ggboard:${GGBOARD_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    # Only the data dir is pinned here; database driver/DSN, JWT secret, etc. come from ../.env
    # (values in `environment:` would override env_file, so keep them out of this block).
    environment:
      GGBOARD_DATA_DIR: /data
    ports:
      # Published on localhost only; put nginx (deploy/nginx.example.conf) in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - ggboard-data:/data
    stop_grace_period: 20s

volumes:
  ggboard-data:

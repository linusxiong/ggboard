# nginx reverse proxy for ggboard. Replace panel.example.com and the certificate paths, and set
# server.trusted_proxies to ["127.0.0.1", "::1"] (GGBOARD_SERVER_TRUSTED_PROXIES=127.0.0.1,::1) so client
# IPs are taken from X-Forwarded-For. ggboard compresses responses itself.
upstream ggboard {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/ssl/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Node traffic pushes may be large (ggboard accepts up to 8 MiB on node endpoints).
    client_max_body_size 8m;

    location / {
        proxy_pass http://ggboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

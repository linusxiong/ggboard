# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1008"]
    errcheck:
      exclude-functions:
        - (*github.com/gin-gonic/gin.Context).Error
    gosec:
      excludes:
        - G104 # duplicated by errcheck
        - G115 # integer conversions are bounded by validation
        - G401 # md5 is required by Xboard-compatible key derivation and legacy hashes
        - G501
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/linusxiong/ggboard
